<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Три символа на Вратах</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <section class="scene">
        <img
          class="scene__background"
          src="img/background.png"
          alt="Замок с Вратами"
        />
        <img
          class="glyph glyph--left"
          src="img/1-glyph.svg"
          alt="Первый символ"
        />
        <img
          class="glyph glyph--center"
          src="img/2-glyph.svg"
          alt="Второй символ"
        />
        <img
          class="glyph glyph--right"
          src="img/3-glyph.svg"
          alt="Третий символ"
        />
      </section>
    </main>
  </body>
</html>
